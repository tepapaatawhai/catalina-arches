[build-system]
requires = ["setuptools>=77", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "catalina"
readme = "README.md"
authors = []
license = "AGPL-3.0-or-later"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: Django",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
]
requires-python = ">=3.12"
dependencies = [
    "arches==8.2.0a4",
    "Django<6.1",
    "arches_controlled_lists>=1.2.0a0,<1.4",
    "arches_her @ git+https://github.com/flaxandteal/arches-her.git@fix/2.0.x-controlled-list-update",
    "arches_json_importer @ git+https://github.com/flaxandteal/arches-json-importer.git",
    "python-dotenv>=1.0.0",
    "django-azure-auth>=1.4.2",
    "django-storages[s3]",
    "uvicorn[standard]",
    "redis",
]

version = "0.0.1"

[dependency-groups]
dev = [
    "black==26.3.1",
    "coverage",
    "django-silk==5.1.0",
    "livereload",
    "pre-commit==3.8.0",
    "sst",
]

[tool.setuptools]
packages = ["catalina"]
