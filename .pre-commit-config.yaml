---
repos:

  - repo: meta
    hooks:
      - id: check-hooks-apply

  - repo: https://github.com/psf/black
    # Keep in step with the black pin in pyproject.toml, which CI runs.
    rev: 26.3.1
    hooks:
      - id: black
        args: [--quiet]
        exclude: /(node_modules|build)/

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npm run prettier:fix
        language: system
        files: catalina/src
      - id: eslint
        name: eslint
        entry: npm run eslint:fix
        language: system
        files: catalina/src
      - id: typescript
        name: typescript
        entry: bash -c 'npm run ts:check'
        language: system
        types_or: [
          "ts",
          "vue",
        ]
